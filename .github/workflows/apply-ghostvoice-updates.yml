name: Apply GhostVoice updates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply feature updates
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def replace_once(path, old, new, label):
              p = root / path
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  print(f'WARNING: {label}: anchor not found')
                  return False
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print(f'patched {path}: {label}')
              return True

          # ---------------- app.py ----------------
          p = root / 'app.py'
          app = p.read_text(encoding='utf-8')

          app = app.replace('import urllib.error\n', 'import urllib.error\nimport smtplib\nfrom email.message import EmailMessage\n', 1)
          app = app.replace('    jwt_secret: str\n', '    jwt_secret: str\n    smtp_host: str = ""\n    smtp_port: int = 587\n    smtp_username: str = ""\n    smtp_password: str = ""\n    smtp_from: str = ""\n    app_base_url: str = "http://localhost:8000"\n', 1)
          app = app.replace('    max_upload_mb: int = 25\n    max_seconds: int = 60\n', '    max_upload_mb: int = 200\n    max_seconds: int = 180\n    max_windows: int = 30\n', 1)
          app = app.replace('    created_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), default=lambda: datetime.now(timezone.utc))\n\n\nclass Recording', '    created_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), default=lambda: datetime.now(timezone.utc))\n    email: Mapped[str | None] = mapped_column(String(320), unique=True, nullable=True, index=True)\n\n\nclass Recording', 1)

          anchor = 'class Audit(Base):\n'
          if 'class PasswordReset(Base):' not in app:
              insert = '''class PasswordReset(Base):\n    __tablename__ = "password_resets"\n    id: Mapped[int] = mapped_column(Integer, primary_key=True)\n    user_id: Mapped[int] = mapped_column(ForeignKey("users.id"), index=True)\n    token_hash: Mapped[str] = mapped_column(String(64), unique=True, index=True)\n    expires_at: Mapped[datetime] = mapped_column(DateTime(timezone=True))\n    used_at: Mapped[datetime | None] = mapped_column(DateTime(timezone=True), nullable=True)\n    created_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), default=lambda: datetime.now(timezone.utc))\n\n\n'''
              app = app.replace(anchor, insert + anchor, 1)

          schema_anchor = 'Base.metadata.create_all(engine)\n'
          if 'def ensure_schema()' not in app:
              schema = '''Base.metadata.create_all(engine)\n\n\ndef ensure_schema():\n    """Apply the small SQLite migrations needed by newer GhostVoice builds."""\n    if not database_url.startswith("sqlite:"):\n        return\n    with engine.begin() as conn:\n        cols = {row[1] for row in conn.exec_driver_sql("PRAGMA table_info(users)").fetchall()}\n        if "email" not in cols:\n            conn.exec_driver_sql("ALTER TABLE users ADD COLUMN email VARCHAR(320)")\n        conn.exec_driver_sql("CREATE UNIQUE INDEX IF NOT EXISTS ix_users_email_unique ON users(email) WHERE email IS NOT NULL")\n\n\nensure_schema()\n'''
              app = app.replace(schema_anchor, schema, 1)

          app = app.replace('    return [y[i:i + n] for i in range(0, len(y) - n + 1, hop)]\n', '''    windows = [y[i:i + n] for i in range(0, len(y) - n + 1, hop)]\n    if len(windows) > s.max_windows:\n        positions = np.linspace(0, len(windows) - 1, s.max_windows, dtype=int)\n        windows = [windows[int(i)] for i in positions]\n    return windows\n''', 1)
          app = app.replace('            MODEL = AutoModelForAudioClassification.from_pretrained(\n                s.base_model\n            ).to(DEVICE).eval()\n', '            MODEL = AutoModelForAudioClassification.from_pretrained(\n                s.base_model,\n                low_cpu_mem_usage=True,\n            ).to(DEVICE).eval()\n', 1)

          app = app.replace('class Credentials(BaseModel):\n    username: str = Field(min_length=3, max_length=64, pattern=r"^[A-Za-z0-9_.-]+$")\n    password: str = Field(min_length=12, max_length=256)\n', '''class Credentials(BaseModel):\n    username: str = Field(min_length=3, max_length=64, pattern=r"^[A-Za-z0-9_.-]+$")\n    password: str = Field(min_length=12, max_length=256)\n    email: str | None = Field(default=None, max_length=320)\n\n\ndef normalize_email(value: str | None) -> str | None:\n    if not value:\n        return None\n    value = value.strip().lower()\n    if not re.fullmatch(r"[^@\\s]+@[^@\\s]+\\.[^@\\s]+", value):\n        raise HTTPException(400, "Enter a valid email address")\n    return value\n\n\ndef send_password_reset_email(email: str, token: str) -> None:\n    if not all((s.smtp_host, s.smtp_username, s.smtp_password, s.smtp_from)):\n        raise RuntimeError("Password reset email is not configured")\n    link = s.app_base_url.rstrip("/") + "/?reset_token=" + token\n    message = EmailMessage()\n    message["Subject"] = "GhostVoice password reset"\n    message["From"] = s.smtp_from\n    message["To"] = email\n    message.set_content(\n        "A GhostVoice password reset was requested.\\n\\n"\n        f"Reset your password: {link}\\n\\n"\n        "This link expires in 30 minutes and can only be used once. "\n        "If you did not request this, you can ignore this email."\n    )\n    with smtplib.SMTP(s.smtp_host, s.smtp_port, timeout=15) as server:\n        server.starttls()\n        server.login(s.smtp_username, s.smtp_password)\n        server.send_message(message)\n''', 1)

          # Registration: require and store recovery email.
          old = '''        if session.scalar(select(User).where(User.username == credentials.username)):\n            raise HTTPException(409, "Username already exists")\n        user = User(username=credentials.username, password_hash=ph.hash(credentials.password))\n'''
          new = '''        email = normalize_email(credentials.email)\n        if not email:\n            raise HTTPException(400, "Email is required for password recovery")\n        if session.scalar(select(User).where(User.username == credentials.username)):\n            raise HTTPException(409, "Username already exists")\n        if session.scalar(select(User).where(User.email == email)):\n            raise HTTPException(409, "Email is already registered")\n        user = User(username=credentials.username, email=email, password_hash=ph.hash(credentials.password))\n'''
          app = app.replace(old, new, 1)

          # Add recovery-email management for existing accounts.
          if '@app.post("/api/account/recovery-email")' not in app:
              marker = '@app.post("/api/login")\n'
              endpoint = '''@app.post("/api/account/recovery-email")\n@limiter.limit(s.rate_limit_auth)\ndef set_recovery_email(request: Request, credentials: Credentials, user: User = Depends(current_user)):\n    require_csrf(request)\n    email = normalize_email(credentials.email)\n    if not email:\n        raise HTTPException(400, "Email is required")\n    session = db()\n    try:\n        existing = session.scalar(select(User).where(User.email == email, User.id != user.id))\n        if existing:\n            raise HTTPException(409, "Email is already registered")\n        row = session.get(User, user.id)\n        row.email = email\n        session.commit()\n    finally:\n        session.close()\n    return {"ok": True}\n\n\n'''
              app = app.replace(marker, endpoint + marker, 1)

          # Password-reset API.
          if '@app.post("/api/forgot-password")' not in app:
              marker = '@app.post("/api/logout")\n'
              endpoints = '''@app.post("/api/forgot-password")\n@limiter.limit("5/hour")\ndef forgot_password(request: Request, credentials: Credentials):\n    # Always return the same response to avoid account enumeration.\n    email = normalize_email(credentials.email) if credentials.email else None\n    if email:\n        session = db()\n        try:\n            user = session.scalar(select(User).where(User.email == email))\n            if user:\n                token = secrets.token_urlsafe(48)\n                token_hash = hashlib.sha256(token.encode()).hexdigest()\n                now = datetime.now(timezone.utc)\n                session.query(PasswordReset).filter(PasswordReset.user_id == user.id, PasswordReset.used_at.is_(None)).update({"used_at": now})\n                session.add(PasswordReset(user_id=user.id, token_hash=token_hash, expires_at=now + timedelta(minutes=30)))\n                session.commit()\n                try:\n                    send_password_reset_email(email, token)\n                except Exception:\n                    # Do not reveal whether an account exists. The event is still rate-limited.\n                    pass\n        finally:\n            session.close()\n    return {"ok": True, "message": "If that email is registered, a reset link has been sent."}\n\n\n@app.post("/api/reset-password")\n@limiter.limit("10/hour")\ndef reset_password(request: Request, token: str = "", new_password: str = ""):\n    require_csrf(request)\n    if not token or len(token) < 40 or len(new_password) < 12 or len(new_password) > 256:\n        raise HTTPException(400, "Invalid reset request")\n    token_hash = hashlib.sha256(token.encode()).hexdigest()\n    session = db()\n    try:\n        now = datetime.now(timezone.utc)\n        reset = session.scalar(select(PasswordReset).where(PasswordReset.token_hash == token_hash))\n        if not reset or reset.used_at is not None or reset.expires_at.replace(tzinfo=timezone.utc) < now:\n            raise HTTPException(400, "Reset link is invalid or expired")\n        user = session.get(User, reset.user_id)\n        if not user:\n            raise HTTPException(400, "Reset link is invalid or expired")\n        user.password_hash = ph.hash(new_password)\n        reset.used_at = now\n        session.query(PasswordReset).filter(PasswordReset.user_id == user.id, PasswordReset.id != reset.id, PasswordReset.used_at.is_(None)).update({"used_at": now})\n        session.commit()\n    finally:\n        session.close()\n    return {"ok": True, "message": "Password changed. You can now sign in."}\n\n\n'''
              app = app.replace(marker, endpoints + marker, 1)

          # UTC timestamp and secure download endpoint.
          old = 'return [{"id": row.file_id, "duration": row.duration, "verdict": row.verdict,\n                 "ai_probability": row.ai_probability, "created_at": row.created_at.isoformat()} for row in rows]\n'
          new = 'return [{"id": row.file_id, "duration": row.duration, "verdict": row.verdict,\n                 "ai_probability": row.ai_probability, "created_at": (row.created_at.replace(tzinfo=timezone.utc) if row.created_at.tzinfo is None else row.created_at).astimezone(timezone.utc).isoformat()} for row in rows]\n'
          app = app.replace(old, new, 1)

          if '/download")' not in app:
              marker = '@app.delete("/api/recordings/{file_id}")\n'
              download = '''@app.get("/api/recordings/{file_id}/download")\ndef download_recording(file_id: str, user: User = Depends(current_user)):\n    if not re.fullmatch(r"[A-Za-z0-9_-]{10,40}", file_id):\n        raise HTTPException(400, "Invalid id")\n    session = db()\n    try:\n        row = session.scalar(select(Recording).where(Recording.file_id == file_id, Recording.user_id == user.id))\n        if not row:\n            raise HTTPException(404, "Not found")\n        duration = row.duration\n    finally:\n        session.close()\n    try:\n        data = encrypted_read(file_id, user.id)\n    except Exception as exc:\n        raise HTTPException(404, "Not found") from exc\n    headers = {\n        "Content-Disposition": f'attachment; filename="ghostvoice-{file_id}.wav"',\n        "Cache-Control": "no-store",\n        "X-Content-Type-Options": "nosniff",\n    }\n    return Response(data, media_type="audio/wav", headers=headers)\n\n\n'''
              app = app.replace(marker, download + marker, 1)

          p.write_text(app, encoding='utf-8')

          # ---------------- index.html ----------------
          p = root / 'web/index.html'
          html = p.read_text(encoding='utf-8')
          html = html.replace('<meta\n    name="description"\n    content="GhostVoice private AI voice authenticity analysis"\n  >', '<meta\n    name="description"\n    content="GhostVoice private AI voice authenticity analysis"\n  >\n\n  <meta name="mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n  <meta name="apple-mobile-web-app-title" content="GhostVoice">\n\n  <link rel="manifest" href="/static/manifest.webmanifest">\n  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">', 1)
          html = html.replace('<link\n    rel="icon"\n    type="image/png"\n    sizes="32x32"\n    href="/static/ghostvoice-32.png"\n  >', '<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-48.png">\n  <link rel="icon" type="image/png" sizes="192x192" href="/static/ghostvoice-192.png">', 1)
          html = html.replace('''          <label>\n\n            <span><h1>\n              PASSWORD\n            </h1></span>''', '''          <label class="register-only hidden">\n\n            <span><h1>\n              RECOVERY EMAIL\n            </h1></span>\n\n            <input\n              id="email"\n              name="email"\n              type="email"\n              autocomplete="email"\n              maxlength="320"\n              placeholder="you@example.com"\n            >\n\n          </label>\n\n\n          <label>\n\n            <span><h1>\n              PASSWORD\n            </h1></span>''', 1)
          html = html.replace('''          <button\n            id="auth-switch"\n            class="secondary"\n            type="button"\n          >\n            CREATE ACCOUNT\n          </button>''', '''          <button\n            id="auth-switch"\n            class="secondary"\n            type="button"\n          >\n            CREATE ACCOUNT\n          </button>\n\n          <button\n            id="forgot-password"\n            class="text-button"\n            type="button"\n          >\n            FORGOT PASSWORD?\n          </button>''', 1)
          html = html.replace('Maximum upload:\n            100 MB', 'Maximum upload:\n            200 MB', 1)
          p.write_text(html, encoding='utf-8')

          # ---------------- app.js ----------------
          p = root / 'web/app.js'
          js = p.read_text(encoding='utf-8')
          js = js.replace('const passwordInput =\n    $("#pass");', 'const passwordInput =\n    $("#pass");\n\nconst emailInput =\n    $("#email");', 1)
          js = js.replace('const message =\n    $("#msg");', 'const message =\n    $("#msg");\n\nconst forgotPasswordButton =\n    $("#forgot-password");', 1)
          # Include email in registration payload.
          js = js.replace('''                password:\n                    passwordInput\n                        .value\n\n            };''', '''                password:\n                    passwordInput\n                        .value,\n\n                email:\n                    emailInput\n                        ? emailInput.value.trim()\n                        : ""\n\n            };''', 1)
          # Show/hide recovery email when switching auth mode.
          js = js.replace('''        passwordInput\n            .setAttribute(\n                "autocomplete",\n                "new-password"\n            );''', '''        passwordInput\n            .setAttribute(\n                "autocomplete",\n                "new-password"\n            );\n\n        if (emailInput) {\n            emailInput.closest("label")?.classList.remove("hidden");\n            emailInput.required = true;\n        }''', 1)
          js = js.replace('''        passwordInput\n            .setAttribute(\n                "autocomplete",\n                "current-password"\n            );''', '''        passwordInput\n            .setAttribute(\n                "autocomplete",\n                "current-password"\n            );\n\n        if (emailInput) {\n            emailInput.closest("label")?.classList.add("hidden");\n            emailInput.required = false;\n            emailInput.value = "";\n        }''', 1)

          enhancement = r'''\n\n/* =========================================================\n   GHOSTVOICE ENHANCEMENTS\n   ========================================================= */\n\n(function () {\n    const state = { audio: null, url: null, id: null, rendering: false };\n\n    function stopCurrent() {\n        if (state.audio) {\n            state.audio.pause();\n            state.audio.currentTime = 0;\n        }\n        if (state.url) {\n            URL.revokeObjectURL(state.url);\n        }\n        state.audio = null;\n        state.url = null;\n        state.id = null;\n    }\n\n    function formatLocalTime(value) {\n        const date = new Date(value);\n        if (Number.isNaN(date.getTime())) return "Unknown time";\n        return new Intl.DateTimeFormat(undefined, {\n            dateStyle: "medium",\n            timeStyle: "short"\n        }).format(date);\n    }\n\n    async function downloadRecording(id) {\n        const response = await fetch(`/api/recordings/${encodeURIComponent(id)}/download`, {\n            credentials: "same-origin",\n            cache: "no-store"\n        });\n        if (!response.ok) throw new Error("Download failed");\n        const blob = await response.blob();\n        const url = URL.createObjectURL(blob);\n        const a = document.createElement("a");\n        a.href = url;\n        a.download = `ghostvoice-${id}.wav`;\n        document.body.appendChild(a);\n        a.click();\n        a.remove();\n        setTimeout(() => URL.revokeObjectURL(url), 1000);\n    }\n\n    async function playRecording(id, playButton, pauseButton) {\n        if (state.id === id && state.audio) {\n            if (state.audio.paused) {\n                await state.audio.play();\n            } else {\n                state.audio.pause();\n            }\n            return;\n        }\n\n        stopCurrent();\n        const response = await fetch(`/api/recordings/${encodeURIComponent(id)}`, {\n            credentials: "same-origin",\n            cache: "no-store"\n        });\n        if (!response.ok) throw new Error("Unable to play recording");\n        const blob = await response.blob();\n        state.url = URL.createObjectURL(blob);\n        state.audio = new Audio(state.url);\n        state.id = id;\n        state.audio.addEventListener("ended", () => {\n            playButton.textContent = "▶ PLAY";\n            pauseButton.disabled = true;\n            playButton.disabled = false;\n            stopCurrent();\n        });\n        state.audio.addEventListener("play", () => {\n            playButton.textContent = "▶ PLAYING";\n            pauseButton.disabled = false;\n        });\n        state.audio.addEventListener("pause", () => {\n            if (state.audio && state.audio.currentTime > 0 && !state.audio.ended) {\n                playButton.textContent = "▶ RESUME";\n                pauseButton.disabled = false;\n            }\n        });\n        await state.audio.play();\n    }\n\n    async function renderLibrary() {\n        if (state.rendering) return;\n        const list = document.querySelector("#list");\n        if (!list || list.dataset.gvEnhanced === "1") return;\n        state.rendering = true;\n        try {\n            const rows = await api("/api/recordings");\n            list.dataset.gvEnhanced = "1";\n            list.innerHTML = "";\n            if (!rows.length) {\n                list.innerHTML = `<div class="library-empty glass"><span class="eyebrow">PRIVATE STORAGE</span><strong>No encrypted recordings yet.</strong><p>Save an analysis to create your first encrypted recording.</p></div>`;\n                return;\n            }\n            for (const row of rows) {\n                const card = document.createElement("article");\n                card.className = "library-item glass gv-library-item";\n                const verdict = escapeHtml(row.verdict === "AI_GENERATED" ? "AI-GENERATED" : row.verdict);\n                const probability = Math.round((row.ai_probability || 0) * 100);\n                const duration = Math.round(Number(row.duration || 0));\n                card.innerHTML = `\n                    <div class="gv-recording-info">\n                        <span class="eyebrow">ENCRYPTED RECORDING</span>\n                        <strong>${verdict}</strong>\n                        <small>${formatLocalTime(row.created_at)} · ${formatTime(duration)} · AI probability ${probability}%</small>\n                    </div>\n                    <div class="gv-recording-actions">\n                        <button class="gv-audio-btn gv-play" type="button">▶ PLAY</button>\n                        <button class="gv-audio-btn gv-pause" type="button" disabled>⏸ PAUSE</button>\n                        <button class="gv-audio-btn gv-download" type="button">⬇ DOWNLOAD</button>\n                        <button class="gv-audio-btn gv-delete gv-danger" type="button">✕ DELETE</button>\n                    </div>`;\n                const play = card.querySelector(".gv-play");\n                const pause = card.querySelector(".gv-pause");\n                const download = card.querySelector(".gv-download");\n                const del = card.querySelector(".gv-delete");\n                play.addEventListener("click", async () => {\n                    try { await playRecording(row.id, play, pause); } catch (e) { setMessage(e.message, true); }\n                });\n                pause.addEventListener("click", () => {\n                    if (state.audio && state.id === row.id) state.audio.pause();\n                });\n                download.addEventListener("click", async () => {\n                    download.disabled = true;\n                    try { await downloadRecording(row.id); } catch (e) { setMessage(e.message, true); } finally { download.disabled = false; }\n                });\n                del.addEventListener("click", async () => {\n                    if (!confirm("Delete this encrypted recording permanently?")) return;\n                    del.disabled = true;\n                    try {\n                        if (state.id === row.id) stopCurrent();\n                        await api(`/api/recordings/${encodeURIComponent(row.id)}`, { method: "DELETE" });\n                        list.dataset.gvEnhanced = "0";\n                        await renderLibrary();\n                    } catch (e) {\n                        del.disabled = false;\n                        setMessage(e.message, true);\n                    }\n                });\n                list.appendChild(card);\n            }\n        } finally {\n            state.rendering = false;\n        }\n    }\n\n    // Re-render whenever the original library loader changes #list.\n    const list = document.querySelector("#list");\n    if (list) {\n        const observer = new MutationObserver(() => {\n            if (list.dataset.gvEnhanced !== "1") renderLibrary();\n        });\n        observer.observe(list, { childList: true });\n    }\n\n    // Make the first library render deterministic even if the original loader is slow.\n    document.addEventListener("click", (event) => {\n        const tab = event.target.closest?.('.tab[data-t="library"]');\n        if (tab) {\n            setTimeout(() => {\n                if (list) list.dataset.gvEnhanced = "0";\n                renderLibrary();\n            }, 150);\n        }\n    });\n\n    // Forgot-password modal.\n    const forgot = document.querySelector("#forgot-password");\n    if (forgot) {\n        const modal = document.createElement("div");\n        modal.className = "gv-modal hidden";\n        modal.innerHTML = `\n          <div class="gv-modal-card glass" role="dialog" aria-modal="true" aria-labelledby="gv-recovery-title">\n            <button class="gv-modal-close" type="button" aria-label="Close">×</button>\n            <span class="eyebrow">ACCOUNT RECOVERY</span>\n            <h2 id="gv-recovery-title">RESET PASSWORD</h2>\n            <p class="gv-modal-copy">Enter your recovery email. If it belongs to a GhostVoice account, we'll send a single-use reset link.</p>\n            <form id="gv-forgot-form">\n              <label><span>RECOVERY EMAIL</span><input id="gv-recovery-email" type="email" required autocomplete="email"></label>\n              <button class="primary" type="submit">SEND RESET LINK</button>\n              <p id="gv-forgot-msg" class="message" role="status"></p>\n            </form>\n            <form id="gv-reset-form" class="hidden">\n              <label><span>NEW PASSWORD</span><input id="gv-new-password" type="password" minlength="12" maxlength="256" required autocomplete="new-password"></label>\n              <button class="primary" type="submit">SET NEW PASSWORD</button>\n              <p id="gv-reset-msg" class="message" role="status"></p>\n            </form>\n          </div>`;\n        document.body.appendChild(modal);\n        const close = () => modal.classList.add("hidden");\n        forgot.addEventListener("click", () => { modal.classList.remove("hidden"); });\n        modal.querySelector(".gv-modal-close").addEventListener("click", close);\n        modal.addEventListener("click", e => { if (e.target === modal) close(); });\n        const forgotForm = modal.querySelector("#gv-forgot-form");\n        const resetForm = modal.querySelector("#gv-reset-form");\n        const forgotMsg = modal.querySelector("#gv-forgot-msg");\n        const resetMsg = modal.querySelector("#gv-reset-msg");\n        const token = new URLSearchParams(location.search).get("reset_token");\n        if (token) {\n            forgotForm.classList.add("hidden");\n            resetForm.classList.remove("hidden");\n            modal.classList.remove("hidden");\n        }\n        forgotForm.addEventListener("submit", async e => {\n            e.preventDefault();\n            try {\n                await api("/api/forgot-password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: "recovery", password: "placeholder-password-123", email: modal.querySelector("#gv-recovery-email").value.trim() }) });\n                forgotMsg.textContent = "If that email is registered, a reset link has been sent.";\n            } catch (err) { forgotMsg.textContent = err.message; forgotMsg.classList.add("error"); }\n        });\n        resetForm.addEventListener("submit", async e => {\n            e.preventDefault();\n            try {\n                await api("/api/reset-password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, new_password: modal.querySelector("#gv-new-password").value }) });\n                resetMsg.textContent = "Password changed. You can now sign in.";\n                history.replaceState({}, "", location.pathname);\n                setTimeout(close, 1000);\n            } catch (err) { resetMsg.textContent = err.message; resetMsg.classList.add("error"); }\n        });\n    }\n})();\n'''
          if 'GHOSTVOICE ENHANCEMENTS' not in js:
              js += enhancement
          p.write_text(js, encoding='utf-8')

          # ---------------- style.css ----------------
          p = root / 'web/style.css'
          css = p.read_text(encoding='utf-8')
          css += r'''\n\n/* =========================================================\n   GhostVoice enhanced controls / recovery UI\n   ========================================================= */\n.register-only.hidden { display: none !important; }\n.text-button {\n  background: transparent; border: 0; color: rgba(255,255,255,.65);\n  cursor: pointer; padding: 10px 6px; font: inherit; letter-spacing: .08em;\n}\n.text-button:hover { color: #fff; text-decoration: underline; }\n.gv-library-item {\n  display: flex; align-items: center; justify-content: space-between; gap: 20px;\n  padding: 20px; margin-bottom: 14px;\n}\n.gv-recording-info { display: grid; gap: 6px; min-width: 0; }\n.gv-recording-info strong { font-size: 1.05rem; }\n.gv-recording-info small { opacity: .68; }\n.gv-recording-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }\n.gv-audio-btn {\n  border: 1px solid rgba(255,255,255,.13); background: rgba(255,255,255,.055);\n  color: #fff; border-radius: 12px; padding: 10px 13px; cursor: pointer;\n  font: inherit; font-size: .75rem; font-weight: 700; letter-spacing: .06em;\n  transition: transform .16s ease, background .16s ease, border-color .16s ease, opacity .16s ease;\n}\n.gv-audio-btn:hover:not(:disabled) { transform: translateY(-2px); background: rgba(255,255,255,.11); border-color: rgba(255,255,255,.3); }\n.gv-audio-btn:disabled { opacity: .38; cursor: not-allowed; }\n.gv-download { border-color: rgba(90,190,255,.3); }\n.gv-danger { border-color: rgba(255,80,100,.3); }\n.gv-danger:hover:not(:disabled) { background: rgba(255,60,80,.12); border-color: rgba(255,80,100,.55); }\n.library-empty { padding: 28px; display: grid; gap: 8px; text-align: center; }\n.gv-modal {\n  position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;\n  padding: 20px; background: rgba(0,0,0,.72); backdrop-filter: blur(12px);\n}\n.gv-modal.hidden { display: none; }\n.gv-modal-card { width: min(460px, 100%); padding: 28px; position: relative; }\n.gv-modal-card h2 { margin: 8px 0; }\n.gv-modal-copy { opacity: .72; line-height: 1.6; }\n.gv-modal-card label { display: grid; gap: 7px; margin: 18px 0; }\n.gv-modal-card label span { font-size: .72rem; font-weight: 800; letter-spacing: .1em; opacity: .75; }\n.gv-modal-card input { width: 100%; box-sizing: border-box; }\n.gv-modal-close {\n  position: absolute; top: 12px; right: 12px; width: 38px; height: 38px;\n  border: 1px solid rgba(255,255,255,.12); border-radius: 50%;\n  background: rgba(255,255,255,.06); color: #fff; font-size: 1.4rem; cursor: pointer;\n}\n@media (max-width: 720px) {\n  .gv-library-item { flex-direction: column; align-items: stretch; }\n  .gv-recording-actions { justify-content: stretch; }\n  .gv-audio-btn { flex: 1 1 calc(50% - 8px); min-height: 46px; }\n}\n'''
          p.write_text(css, encoding='utf-8')

          # ---------------- HF/PWA files ----------------
          (root / 'web/manifest.webmanifest').write_text('''{\n  "name": "GhostVoice",\n  "short_name": "GhostVoice",\n  "description": "Private AI voice authenticity analysis",\n  "start_url": "/",\n  "display": "standalone",\n  "background_color": "#050812",\n  "theme_color": "#050812",\n  "icons": [\n    {"src": "/static/ghostvoice-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any maskable"},\n    {"src": "/static/ghostvoice-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable"}\n  ]\n}\n''', encoding='utf-8')

          (root / 'web/sw.js').write_text('''const CACHE = "ghostvoice-shell-v1";\nconst STATIC = ["/", "/static/style.css", "/static/app.js", "/static/manifest.webmanifest"];\nself.addEventListener("install", event => { event.waitUntil(caches.open(CACHE).then(cache => cache.addAll(STATIC)).then(() => self.skipWaiting())); });\nself.addEventListener("activate", event => { event.waitUntil(self.clients.claim()); });\nself.addEventListener("fetch", event => {\n  const url = new URL(event.request.url);\n  if (url.origin !== location.origin || event.request.method !== "GET" || url.pathname.startsWith("/api/")) return;\n  event.respondWith(fetch(event.request).catch(() => caches.match(event.request)));\n});\n''', encoding='utf-8')

          # Generate crisp icon variants from the existing high-resolution logo.
          import shutil, subprocess
          logo = root / 'web/ghostvoice-logo.png'
          if logo.exists() and shutil.which('magick'):
              for size, name in [(48,'favicon-48.png'), (180,'apple-touch-icon.png'), (192,'ghostvoice-192.png'), (512,'ghostvoice-512.png')]:
                  subprocess.run(['magick', str(logo), '-resize', f'{size}x{size}', '-background', '#050812', '-gravity', 'center', '-extent', f'{size}x{size}', str(root/'web'/name)], check=True)
          elif logo.exists() and shutil.which('convert'):
              for size, name in [(48,'favicon-48.png'), (180,'apple-touch-icon.png'), (192,'ghostvoice-192.png'), (512,'ghostvoice-512.png')]:
                  subprocess.run(['convert', str(logo), '-resize', f'{size}x{size}', '-background', '#050812', '-gravity', 'center', '-extent', f'{size}x{size}', str(root/'web'/name)], check=True)
          else:
              print('WARNING: ImageMagick unavailable; existing icon files were not regenerated.')

          # ---------------- requirements.txt ----------------
          p = root / 'requirements.txt'
          req = p.read_text(encoding='utf-8').splitlines()
          remove = {'datasets','accelerate','evaluate','audiomentations','torchaudio'}
          req = [x for x in req if x.strip() not in remove and x.strip()]
          p.write_text('\n'.join(req) + '\n', encoding='utf-8')

          # ---------------- .env.example ----------------
          p = root / '.env.example'
          env = p.read_text(encoding='utf-8')
          additions = '''\n# Password recovery / SMTP\nSMTP_HOST=\nSMTP_PORT=587\nSMTP_USERNAME=\nSMTP_PASSWORD=\nSMTP_FROM=\nAPP_BASE_URL=https://YOUR-HF-SPACE.hf.space\nMAX_WINDOWS=30\n'''
          if 'SMTP_HOST=' not in env:
              env += additions
          env = re.sub(r'MAX_UPLOAD_MB=.*', 'MAX_UPLOAD_MB=200', env)
          env = re.sub(r'MAX_SECONDS=.*', 'MAX_SECONDS=180', env)
          p.write_text(env, encoding='utf-8')

          # ---------------- Dockerfile ----------------
          p = root / 'Dockerfile'
          docker = p.read_text(encoding='utf-8')
          docker = docker.replace('--port","8000', '--port","7860')
          if '--port","8000' in docker:
              docker = docker.replace('--port","8000', '--port","7860')
          docker = docker.replace('CMD ["uvicorn","app:app","--host","0.0.0.0","--port","8000"]', 'EXPOSE 7860\nCMD ["uvicorn","app:app","--host","0.0.0.0","--port","7860"]')
          p.write_text(docker, encoding='utf-8')

          # Service worker registration.
          html = (root/'web/index.html').read_text(encoding='utf-8')
          if 'navigator.serviceWorker' not in html:
              html = html.replace('</body>', '<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/static/sw.js").catch(()=>{});</script>\n</body>', 1)
          (root/'web/index.html').write_text(html, encoding='utf-8')

          print('GhostVoice update patch complete.')
          PY

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "ghostvoice-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: GhostVoice recovery, library controls, PWA and HF optimizations" || exit 0
          git push origin HEAD:main
