name: Repair GhostVoice runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair backend and CSS
        shell: python
        run: |
          from pathlib import Path
          import re

          # Local development must be able to use the auth/CSRF cookies over HTTP.
          p = Path('app.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('secure=s.cookie_secure, httponly=False', 'secure=(s.cookie_secure and request.url.scheme == "https"), httponly=False')
          text = text.replace('secure=s.cookie_secure,\n                        samesite=', 'secure=(s.cookie_secure and request.url.scheme == "https"),\n                        samesite=')
          text = text.replace('response.set_cookie("access_token", make_token(user_id), httponly=True, secure=s.cookie_secure,', 'response.set_cookie("access_token", make_token(user_id), httponly=True, secure=(s.cookie_secure and request.url.scheme == "https"),')
          p.write_text(text, encoding='utf-8')

          p = Path('web/style.css')
          css = p.read_text(encoding='utf-8')
          marker = '/* GHOSTVOICE RUNTIME REPAIR */'
          if marker not in css:
              css += r'''

/* GHOSTVOICE RUNTIME REPAIR */
.text-button{display:block;width:100%;margin-top:10px;padding:12px 16px;border:1px solid rgba(90,220,255,.3);border-radius:12px;background:rgba(90,220,255,.05);color:#72e8ff;cursor:pointer;font:inherit;font-weight:800;letter-spacing:.05em}.text-button:hover{background:rgba(90,220,255,.1)}
.gv-modal{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.76);backdrop-filter:blur(14px)}.gv-modal.hidden{display:none}.gv-modal-card{width:min(460px,100%);padding:28px;position:relative}.gv-modal-card h2{margin:8px 0 18px}.gv-modal-card label{display:grid;gap:7px;margin:14px 0}.gv-modal-card label span{font-size:.72rem;font-weight:800;letter-spacing:.08em}.gv-modal-card input{width:100%;box-sizing:border-box}.gv-modal-close{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;font-size:1.4rem;cursor:pointer}.gv-recording-info{display:grid;gap:6px}.gv-recording-actions{display:flex;gap:8px;flex-wrap:wrap}.gv-audio-btn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#fff;border-radius:10px;padding:10px 13px;cursor:pointer;font:inherit;font-size:.72rem;font-weight:800}.gv-audio-btn:disabled{opacity:.4;cursor:not-allowed}.gv-audio-btn:hover:not(:disabled){background:rgba(255,255,255,.1)}
@media(max-width:720px){.gv-recording-actions{display:grid;grid-template-columns:1fr 1fr}.gv-audio-btn{min-height:44px}.auth-screen{grid-template-columns:1fr}.auth-visual{display:none}}
'''
          p.write_text(css, encoding='utf-8')

      - name: Validate frontend
        run: node --check web/app.js

      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "ghostvoice-repair-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py web/style.css
          git diff --cached --check
          git commit -m "fix: repair local auth cookies and UI controls" || exit 0
          git push origin HEAD:main
