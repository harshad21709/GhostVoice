name: Repair GhostVoice UI and auth

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair source files
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          # ---------------- app.py ----------------
          p = root / 'app.py'
          app = p.read_text(encoding='utf-8')

          app = app.replace('import smtplib\nfrom email.message import EmailMessage\nimport smtplib\nfrom email.message import EmailMessage\n', 'import smtplib\nfrom email.message import EmailMessage\n', 1)

          duplicate_settings = '''    smtp_host: str = ""\n    smtp_port: int = 587\n    smtp_username: str = ""\n    smtp_password: str = ""\n    smtp_from: str = ""\n    app_base_url: str = "http://localhost:8000"\n    smtp_host: str = ""\n    smtp_port: int = 587\n    smtp_username: str = ""\n    smtp_password: str = ""\n    smtp_from: str = ""\n    app_base_url: str = "http://localhost:8000"\n'''
          single_settings = '''    smtp_host: str = ""\n    smtp_port: int = 587\n    smtp_username: str = ""\n    smtp_password: str = ""\n    smtp_from: str = ""\n    app_base_url: str = "http://localhost:8000"\n'''
          app = app.replace(duplicate_settings, single_settings, 1)

          # Replace the entire duplicated password-email helper region with one clean copy.
          email_region = re.compile(r'def send_password_reset_email\(email: str, token: str\) -> None:.*?(?=\n\n@app\.get\("/"\))', re.S)
          clean_email = '''def send_password_reset_email(email: str, token: str) -> None:\n    if not all((s.smtp_host, s.smtp_username, s.smtp_password, s.smtp_from)):\n        raise RuntimeError("Password reset email is not configured")\n    link = s.app_base_url.rstrip("/") + "/?reset_token=" + token\n    message = EmailMessage()\n    message["Subject"] = "GhostVoice password reset"\n    message["From"] = s.smtp_from\n    message["To"] = email\n    message.set_content(\n        "A GhostVoice password reset was requested.\\n\\n"\n        f"Reset your password: {link}\\n\\n"\n        "This link expires in 30 minutes and can only be used once. "\n        "If you did not request this, you can ignore this email."\n    )\n    with smtplib.SMTP(s.smtp_host, s.smtp_port, timeout=15) as server:\n        server.starttls()\n        server.login(s.smtp_username, s.smtp_password)\n        server.send_message(message)'''
          app, n = email_region.subn(clean_email, app, count=1)
          assert n == 1, 'password email helper anchor not found'

          # Dedicated request models make the reset API accept JSON correctly.
          if 'class ForgotPasswordRequest(BaseModel):' not in app:
              marker = 'class Credentials(BaseModel):\n'
              models = '''class ForgotPasswordRequest(BaseModel):\n    email: str = Field(min_length=3, max_length=320)\n\n\nclass ResetPasswordRequest(BaseModel):\n    token: str = Field(min_length=40, max_length=256)\n    new_password: str = Field(min_length=12, max_length=256)\n\n\n'''
              app = app.replace(marker, models + marker, 1)

          # Replace forgot/reset endpoints as one consistent JSON API.
          recovery_region = re.compile(r'@app\.post\("/api/forgot-password"\).*?(?=\n\n@app\.post\("/api/logout"\))', re.S)
          clean_recovery = '''@app.post("/api/forgot-password")\n@limiter.limit("5/hour")\ndef forgot_password(request: Request, payload: ForgotPasswordRequest):\n    # Always return the same response to avoid account enumeration.\n    email = normalize_email(payload.email)\n    session = db()\n    try:\n        user = session.scalar(select(User).where(User.email == email))\n        if user:\n            token = secrets.token_urlsafe(48)\n            token_hash = hashlib.sha256(token.encode()).hexdigest()\n            now = datetime.now(timezone.utc)\n            session.query(PasswordReset).filter(\n                PasswordReset.user_id == user.id,\n                PasswordReset.used_at.is_(None),\n            ).update({"used_at": now})\n            session.add(PasswordReset(\n                user_id=user.id,\n                token_hash=token_hash,\n                expires_at=now + timedelta(minutes=30),\n            ))\n            session.commit()\n            try:\n                send_password_reset_email(email, token)\n            except Exception as exc:\n                print(f"[GhostVoice] Password reset email failed: {exc}")\n    finally:\n        session.close()\n    return {"ok": True, "message": "If that email is registered, a reset link has been sent."}\n\n\n@app.post("/api/reset-password")\n@limiter.limit("10/hour")\ndef reset_password(request: Request, payload: ResetPasswordRequest):\n    require_csrf(request)\n    token_hash = hashlib.sha256(payload.token.encode()).hexdigest()\n    session = db()\n    try:\n        now = datetime.now(timezone.utc)\n        reset = session.scalar(select(PasswordReset).where(PasswordReset.token_hash == token_hash))\n        if not reset or reset.used_at is not None:\n            raise HTTPException(400, "Reset link is invalid or expired")\n        expires = reset.expires_at\n        if expires.tzinfo is None:\n            expires = expires.replace(tzinfo=timezone.utc)\n        if expires < now:\n            raise HTTPException(400, "Reset link is invalid or expired")\n        user = session.get(User, reset.user_id)\n        if not user:\n            raise HTTPException(400, "Reset link is invalid or expired")\n        user.password_hash = ph.hash(payload.new_password)\n        reset.used_at = now\n        session.query(PasswordReset).filter(\n            PasswordReset.user_id == user.id,\n            PasswordReset.id != reset.id,\n            PasswordReset.used_at.is_(None),\n        ).update({"used_at": now})\n        session.commit()\n    finally:\n        session.close()\n    return {"ok": True, "message": "Password changed. You can now sign in."}'''
          app, n = recovery_region.subn(clean_recovery, app, count=1)
          assert n == 1, 'recovery endpoint anchor not found'

          # Secure cookies must work for local HTTP development while staying Secure on HTTPS.
          app = app.replace('secure=s.cookie_secure,', 'secure=(s.cookie_secure and request.url.scheme == "https"),')

          p.write_text(app, encoding='utf-8')

          # ---------------- index.html ----------------
          p = root / 'web/index.html'
          html = p.read_text(encoding='utf-8')

          # Remove duplicate recovery-email label and duplicate forgot-password button.
          email_label = '''\n\n          <label class="register-only hidden">\n\n            <span><h1>\n              RECOVERY EMAIL\n            </h1></span>\n\n            <input\n              id="email"\n              name="email"\n              type="email"\n              autocomplete="email"\n              maxlength="320"\n              placeholder="you@example.com"\n            >\n\n          </label>'''
          html = html.replace(email_label + email_label, email_label, 1)
          forgot_button = '''\n\n          <button\n            id="forgot-password"\n            class="text-button"\n            type="button"\n          >\n            FORGOT PASSWORD?\n          </button>'''
          html = html.replace(forgot_button + forgot_button, forgot_button, 1)

          # Remove duplicated mobile/PWA metadata block.
          mobile_block = '''\n\n  <meta name="mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n  <meta name="apple-mobile-web-app-title" content="GhostVoice">\n\n  <link rel="manifest" href="/static/manifest.webmanifest">\n  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">'''
          html = html.replace(mobile_block + mobile_block, mobile_block, 1)

          # The service worker must be registered from app.js because production CSP blocks inline scripts.
          html = re.sub(r'\n<script>if \("serviceWorker" in navigator\).*?</script>\s*\n</body>', '\n</body>', html, flags=re.S)
          p.write_text(html, encoding='utf-8')

          # ---------------- app.js ----------------
          p = root / 'web/app.js'
          js = p.read_text(encoding='utf-8')

          # Remove duplicate declarations that currently prevent the whole script from parsing.
          js = js.replace('const emailInput =\n    $("#email");\n\nconst emailInput =\n    $("#email");', 'const emailInput =\n    $("#email");', 1)
          js = js.replace('const forgotPasswordButton =\n    $("#forgot-password");\n\nconst forgotPasswordButton =\n    $("#forgot-password");', 'const forgotPasswordButton =\n    $("#forgot-password");', 1)

          # Collapse duplicated email show/hide blocks.
          show_email = '''        if (emailInput) {\n            emailInput.closest("label")?.classList.remove("hidden");\n            emailInput.required = true;\n        }\n\n        if (emailInput) {\n            emailInput.closest("label")?.classList.remove("hidden");\n            emailInput.required = true;\n        }'''
          js = js.replace(show_email, show_email.split('\n\n        if (emailInput) {')[0] + '\n\n        if (emailInput) {' + '\n'.join(show_email.split('\n\n        if (emailInput) {')[2:]), 1) if show_email in js else js
          # Safer direct exact replacement after the previous operation.
          js = js.replace('''        if (emailInput) {\n            emailInput.closest("label")?.classList.remove("hidden");\n            emailInput.required = true;\n        }\n\n        if (emailInput) {\n            emailInput.closest("label")?.classList.remove("hidden");\n            emailInput.required = true;\n        }''', '''        if (emailInput) {\n            emailInput.closest("label")?.classList.remove("hidden");\n            emailInput.required = true;\n        }''', 1)
          js = js.replace('''        if (emailInput) {\n            emailInput.closest("label")?.classList.add("hidden");\n            emailInput.required = false;\n            emailInput.value = "";\n        }\n\n        if (emailInput) {\n            emailInput.closest("label")?.classList.add("hidden");\n            emailInput.required = false;\n            emailInput.value = "";\n        }''', '''        if (emailInput) {\n            emailInput.closest("label")?.classList.add("hidden");\n            emailInput.required = false;\n            emailInput.value = "";\n        }''', 1)

          # The previous update accidentally appended a literal backslash-n sequence. Normalize it.
          js = js.replace('checkSession();\\n\\n/*', 'checkSession();\n\n/*')

          # Replace the old library implementation with one coherent player/download/delete implementation.
          library_region = re.compile(r'/\* =========================================================\n   LIBRARY\n   ========================================================= \*/.*?/\* =========================================================\n   INITIALIZATION\n   ========================================================= \*/', re.S)
          clean_library = r'''/* =========================================================
   LIBRARY
   ========================================================= */

let libraryAudio = null;
let libraryAudioUrl = null;
let libraryAudioId = null;

function stopLibraryAudio(resetPosition = true) {
    if (libraryAudio) {
        libraryAudio.pause();
        if (resetPosition) libraryAudio.currentTime = 0;
    }
    if (libraryAudioUrl) {
        URL.revokeObjectURL(libraryAudioUrl);
    }
    libraryAudio = null;
    libraryAudioUrl = null;
    libraryAudioId = null;
}

function formatLocalDate(value) {
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "Unknown time";
    return new Intl.DateTimeFormat(undefined, {
        dateStyle: "medium",
        timeStyle: "short"
    }).format(date);
}

async function downloadRecording(fileId, button) {
    button.disabled = true;
    const oldText = button.textContent;
    button.textContent = "DOWNLOADING…";
    try {
        const response = await fetch(
            `/api/recordings/${encodeURIComponent(fileId)}/download`,
            { credentials: "same-origin", cache: "no-store" }
        );
        if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            throw new Error(data.detail || "Unable to download recording.");
        }
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = `ghostvoice-${fileId}.wav`;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    } finally {
        button.disabled = false;
        button.textContent = oldText;
    }
}

async function playLibraryRecording(fileId, playButton, pauseButton) {
    if (libraryAudioId === fileId && libraryAudio) {
        if (libraryAudio.paused) {
            await libraryAudio.play();
        } else {
            libraryAudio.pause();
        }
        return;
    }

    stopLibraryAudio();
    const response = await fetch(
        `/api/recordings/${encodeURIComponent(fileId)}`,
        { credentials: "same-origin", cache: "no-store" }
    );
    if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.detail || "Unable to load recording.");
    }

    const blob = await response.blob();
    libraryAudioUrl = URL.createObjectURL(blob);
    libraryAudio = new Audio(libraryAudioUrl);
    libraryAudioId = fileId;

    const syncButtons = () => {
        const playing = !libraryAudio.paused && !libraryAudio.ended;
        playButton.textContent = playing ? "▶ PLAYING" : "▶ RESUME";
        pauseButton.disabled = !playing;
    };

    libraryAudio.addEventListener("play", syncButtons);
    libraryAudio.addEventListener("pause", syncButtons);
    libraryAudio.addEventListener("ended", () => {
        playButton.textContent = "▶ PLAY";
        pauseButton.disabled = true;
        stopLibraryAudio();
    });

    await libraryAudio.play();
    syncButtons();
}

async function loadLibrary() {
    const list = $("#list");
    if (!list) return;

    list.innerHTML = `
        <div class="result-card glass library-loading">
            Loading encrypted recordings…
        </div>`;

    try {
        const recordings = await api("/api/recordings");
        if (!recordings.length) {
            list.innerHTML = `
                <div class="result-card glass library-empty">
                    <span class="eyebrow">PRIVATE STORAGE</span>
                    <strong>No encrypted recordings yet.</strong>
                    <small>Save an analysis to create your first encrypted recording.</small>
                </div>`;
            return;
        }

        list.innerHTML = recordings.map(recording => {
            const probability = Math.round((recording.ai_probability || 0) * 100);
            const duration = formatTime(Math.round(Number(recording.duration || 0)));
            const verdictText = verdictLabel(recording.verdict);
            const state = recording.verdict === "HUMAN" ? "result-human" : recording.verdict === "AI_GENERATED" ? "result-ai" : "result-uncertain";
            return `
                <article class="library-item glass gv-library-item ${state}">
                    <div class="gv-recording-info">
                        <span class="eyebrow">ENCRYPTED RECORDING</span>
                        <strong>${escapeHtml(verdictText)}</strong>
                        <small>${escapeHtml(formatLocalDate(recording.created_at))} · ${duration} · AI probability ${probability}%</small>
                    </div>
                    <div class="gv-recording-actions">
                        <button class="gv-audio-btn gv-play" type="button" data-id="${escapeHtml(recording.id)}">▶ PLAY</button>
                        <button class="gv-audio-btn gv-pause" type="button" data-id="${escapeHtml(recording.id)}" disabled>⏸ PAUSE</button>
                        <button class="gv-audio-btn gv-download" type="button" data-id="${escapeHtml(recording.id)}">⬇ DOWNLOAD</button>
                        <button class="gv-audio-btn gv-delete gv-danger" type="button" data-id="${escapeHtml(recording.id)}">✕ DELETE</button>
                    </div>
                </article>`;
        }).join("");

        list.querySelectorAll(".gv-play").forEach(button => {
            button.addEventListener("click", async () => {
                try {
                    const id = button.dataset.id;
                    const card = button.closest(".gv-library-item");
                    const pause = card.querySelector(".gv-pause");
                    await playLibraryRecording(id, button, pause);
                } catch (error) {
                    setMessage(error.message, true);
                }
            });
        });

        list.querySelectorAll(".gv-pause").forEach(button => {
            button.addEventListener("click", () => {
                if (libraryAudio && libraryAudioId === button.dataset.id) {
                    libraryAudio.pause();
                }
            });
        });

        list.querySelectorAll(".gv-download").forEach(button => {
            button.addEventListener("click", async () => {
                try {
                    await downloadRecording(button.dataset.id, button);
                } catch (error) {
                    setMessage(error.message, true);
                }
            });
        });

        list.querySelectorAll(".gv-delete").forEach(button => {
            button.addEventListener("click", async () => {
                if (!confirm("Permanently delete this encrypted recording?")) return;
                button.disabled = true;
                try {
                    if (libraryAudioId === button.dataset.id) stopLibraryAudio();
                    await api(`/api/recordings/${encodeURIComponent(button.dataset.id)}`, { method: "DELETE" });
                    await loadLibrary();
                } catch (error) {
                    button.disabled = false;
                    setMessage(error.message, true);
                }
            });
        });
    } catch (error) {
        list.innerHTML = `
            <div class="result-card glass">
                <strong>${escapeHtml(error.message)}</strong>
            </div>`;
    }
}


/* =========================================================
   INITIALIZATION
   ========================================================= */'''
          js, n = library_region.subn(clean_library, js, count=1)
          assert n == 1, 'library region not found'

          # Remove any stale enhancement block that may still exist after initialization.
          js = re.sub(r'\n/\* =========================================================\n   GHOSTVOICE ENHANCEMENTS\n   ========================================================= \*/.*$', '', js, flags=re.S)

          # Add password recovery modal and PWA registration after the normal initialization call.
          js += r'''

/* =========================================================
   PASSWORD RECOVERY UI
   ========================================================= */
(function setupPasswordRecovery() {
    if (!forgotPasswordButton) return;

    const modal = document.createElement("div");
    modal.className = "gv-modal hidden";
    modal.innerHTML = `
        <div class="gv-modal-card glass" role="dialog" aria-modal="true" aria-labelledby="gv-recovery-title">
            <button class="gv-modal-close" type="button" aria-label="Close">×</button>
            <span class="eyebrow">ACCOUNT RECOVERY</span>
            <h2 id="gv-recovery-title">RESET PASSWORD</h2>
            <p class="gv-modal-copy">Enter your recovery email. If it is registered, GhostVoice will send a single-use reset link.</p>
            <form id="gv-forgot-form">
                <label><span>RECOVERY EMAIL</span><input id="gv-recovery-email" type="email" autocomplete="email" required></label>
                <button class="primary" type="submit">SEND RESET LINK</button>
                <p id="gv-forgot-msg" class="message" role="status"></p>
            </form>
            <form id="gv-reset-form" class="hidden">
                <label><span>NEW PASSWORD</span><input id="gv-new-password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label>
                <label><span>CONFIRM PASSWORD</span><input id="gv-confirm-password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label>
                <button class="primary" type="submit">RESET PASSWORD</button>
                <p id="gv-reset-msg" class="message" role="status"></p>
            </form>
        </div>`;
    document.body.appendChild(modal);

    const close = () => modal.classList.add("hidden");
    modal.querySelector(".gv-modal-close").addEventListener("click", close);
    modal.addEventListener("click", event => { if (event.target === modal) close(); });

    forgotPasswordButton.addEventListener("click", () => {
        modal.classList.remove("hidden");
        modal.querySelector("#gv-forgot-form").classList.remove("hidden");
        modal.querySelector("#gv-reset-form").classList.add("hidden");
    });

    const token = new URLSearchParams(window.location.search).get("reset_token");
    if (token) {
        modal.classList.remove("hidden");
        modal.querySelector("#gv-forgot-form").classList.add("hidden");
        modal.querySelector("#gv-reset-form").classList.remove("hidden");
    }

    modal.querySelector("#gv-forgot-form").addEventListener("submit", async event => {
        event.preventDefault();
        const form = event.currentTarget;
        const email = form.querySelector("#gv-recovery-email").value.trim();
        const msg = form.querySelector("#gv-forgot-msg");
        const submit = form.querySelector("button[type=submit]");
        submit.disabled = true;
        try {
            const result = await api("/api/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email })
            });
            msg.textContent = result.message || "If that email is registered, a reset link has been sent.";
            msg.classList.remove("error");
        } catch (error) {
            msg.textContent = error.message;
            msg.classList.add("error");
        } finally {
            submit.disabled = false;
        }
    });

    modal.querySelector("#gv-reset-form").addEventListener("submit", async event => {
        event.preventDefault();
        const form = event.currentTarget;
        const password = form.querySelector("#gv-new-password").value;
        const confirmPassword = form.querySelector("#gv-confirm-password").value;
        const msg = form.querySelector("#gv-reset-msg");
        if (password !== confirmPassword) {
            msg.textContent = "Passwords do not match.";
            msg.classList.add("error");
            return;
        }
        const submit = form.querySelector("button[type=submit]");
        submit.disabled = true;
        try {
            const result = await api("/api/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, new_password: password })
            });
            msg.textContent = result.message || "Password changed. You can now sign in.";
            msg.classList.remove("error");
            window.history.replaceState({}, "", window.location.pathname);
            setTimeout(close, 900);
        } catch (error) {
            msg.textContent = error.message;
            msg.classList.add("error");
        } finally {
            submit.disabled = false;
        }
    });
})();

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/static/sw.js").catch(() => {});
}
'''

          p.write_text(js, encoding='utf-8')

          # ---------------- CSS ----------------
          p = root / 'web/style.css'
          css = p.read_text(encoding='utf-8')
          if '.gv-modal {' not in css:
              css += r'''

/* GhostVoice recording controls and password recovery */
.text-button {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 13px 16px;
    border: 1px solid rgba(72, 222, 255, .35);
    border-radius: 12px;
    background: rgba(72, 222, 255, .06);
    color: #57e7ff;
    cursor: pointer;
    font: inherit;
    font-weight: 800;
    letter-spacing: .06em;
    transition: .18s ease;
}
.text-button:hover { background: rgba(72, 222, 255, .13); border-color: rgba(72, 222, 255, .7); transform: translateY(-1px); }
.gv-library-item { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:20px; margin-bottom:14px; }
.gv-recording-info { display:grid; gap:6px; min-width:0; }
.gv-recording-info strong { font-size:1.05rem; }
.gv-recording-info small { opacity:.7; }
.gv-recording-actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
.gv-audio-btn { border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.055); color:#fff; border-radius:12px; padding:11px 14px; cursor:pointer; font:inherit; font-size:.74rem; font-weight:800; letter-spacing:.05em; transition:.16s ease; }
.gv-audio-btn:hover:not(:disabled) { transform:translateY(-2px); background:rgba(255,255,255,.11); border-color:rgba(255,255,255,.32); }
.gv-audio-btn:disabled { opacity:.38; cursor:not-allowed; }
.gv-download { border-color:rgba(85,220,255,.35); }
.gv-danger { border-color:rgba(255,80,100,.35); }
.gv-danger:hover:not(:disabled) { background:rgba(255,70,90,.12); border-color:rgba(255,90,110,.65); }
.gv-modal { position:fixed; inset:0; z-index:9999; display:grid; place-items:center; padding:20px; background:rgba(0,0,0,.72); backdrop-filter:blur(12px); }
.gv-modal.hidden { display:none; }
.gv-modal-card { position:relative; width:min(460px,100%); padding:28px; }
.gv-modal-card h2 { margin:8px 0; }
.gv-modal-copy { opacity:.72; line-height:1.6; }
.gv-modal-card label { display:grid; gap:7px; margin:16px 0; }
.gv-modal-card label span { font-size:.72rem; font-weight:800; letter-spacing:.1em; opacity:.75; }
.gv-modal-card input { width:100%; box-sizing:border-box; }
.gv-modal-close { position:absolute; top:12px; right:12px; width:38px; height:38px; border:1px solid rgba(255,255,255,.14); border-radius:50%; background:rgba(255,255,255,.06); color:#fff; font-size:1.4rem; cursor:pointer; }
@media (max-width:720px) { .gv-library-item { flex-direction:column; align-items:stretch; } .gv-recording-actions { justify-content:stretch; } .gv-audio-btn { flex:1 1 calc(50% - 8px); min-height:46px; } }
'''
          p.write_text(css, encoding='utf-8')

          print('Repair complete')

      - name: Validate Python
        run: python -m py_compile app.py

      - name: Validate JavaScript
        run: node --check web/app.js

      - name: Commit repair
        shell: bash
